name: CI

on:
  push:
    branches: ["**"]
  repository_dispatch:
    types: [ci-trigger]
  workflow_dispatch:

jobs:
  trigger:
    name: Trigger
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI ai déclenché"

  ci:
    needs: trigger
    uses: transummer2026/.github/.github/workflows/ci-service.yml@main
    with:
      service_name: ai
      lint_cmd: ruff check .
      test_cmd: pytest
      build_cmd: docker build -t temp .
      audit_cmd: pip-audit
      coverage_cmd: pytest --cov=. --cov-report=xml
      coverage_format: cobertura
      coverage_threshold: 0
    secrets:
      OTEL_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      DISCORD_WEBHOOK_REPO: ${{ secrets.DISCORD_WEBHOOK_AI }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}