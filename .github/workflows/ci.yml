name: CI

on:
  pull_request:
    branches: [dev, main, staging]
  push:
    branches: ["dev"]
  repository_dispatch:
    types: [ci-trigger]
  workflow_dispatch:

# Annule les runs obsolètes quand on repush sur une PR ; jamais sur dev
# (le build/push d'image doit aller au bout).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  ci:
    uses: transummer2026/.github/.github/workflows/ci-service.yml@main
    with:
      service_name: ai
      # TODO: brancher uv pour installer les deps avant lint/tests..
      install_cmd: ""
      lint_cmd: ruff check .
      test_cmd: pytest
      build_cmd: docker build -t temp .
      audit_cmd: pip-audit
      coverage_cmd: pytest --cov=. --cov-report=xml
      coverage_format: cobertura
      coverage_threshold: 0
    secrets:
      OTEL_ENDPOINT: ${{ secrets.OTEL_ENDPOINT }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      DISCORD_WEBHOOK_REPO: ${{ secrets.DISCORD_WEBHOOK_AI }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      SEMANTIC_TOKEN: ${{ secrets.SEMANTIC_TOKEN }}